# Källförteckning för Restore.
#
# Varje källa måste kunna kontrolleras: DOI, ISBN eller direktlänk. Fältet verifierad anger
# när och hur de bibliografiska uppgifterna kontrollerades. En källa utan verifierad visas som
# overifierad i gränssnittet. Hitta aldrig på referenser.
#
# Källtyper: lärobok, klassisk originalartikel, översiktsartikel, systematisk översikt,
# metaanalys, randomiserad kontrollerad studie, observationsstudie, experimentell studie,
# metodartikel, konsensusdokument.
#
# Kontrollera DOI:er mot Crossref med: node tools/verify-sources.mjs

