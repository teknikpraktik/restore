# Självtest för 1.6 Belastning och återhämtning – kroppens normala rytm.

fragor:
  - id: traningseffekt
    typ: forstaelse
    fraga: Vilka påståenden om träningseffekter stämmer med kapitlet?
    alternativ:
      - Belastningen behöver vara så hög att man blir helt utmattad varje gång.
      - Man bör träna varje dag så att kroppen inte hinner vänja sig av.
      - Påfrestningen behöver upprepas och följas av återhämtning som kroppen hinner med.
      - Anpassningen gäller främst den typ av belastning man har utsatts för.
    ratt: [ 3, 4 ]
    forklaring: >-
      Kroppen anpassar sig när påfrestningen upprepas och följs av återhämtning, och anpassningen gäller just
      den belastning som har tränats. Utmattning varje gång eller daglig träning utan återhämtning är inte
      förutsättningar.

  - id: snabb-fas
    typ: forstaelse
    fraga: Vad förklarar främst att pulsen sjunker så snabbt under den första halvminuten efter en ansträngning?
    alternativ:
      - Att musklerna snabbt slutar producera värme.
      - Att stresshormonerna i blodet bryts ned inom några sekunder.
      - Att blodtrycket sjunker kraftigt och hjärtat därför slår långsammare.
      - Att vagusnerven, som bromsar hjärtat, snabbt blir aktiv igen.
    ratt: 4
    forklaring: >-
      Den snabba fasen beror främst på att vagusnerven återaktiveras. Hormoner och värme påverkar den
      långsammare fasen som följer.

  - id: tolka-hemmatest
    typ: slutsats
    fraga: >-
      Efter en minut i trappan sjönk din puls bara 10 slag under den första minuten. I studier av arbetsprov
      är långsam återgång kopplad till ökad risk. Vilken slutsats är rimlig?
    alternativ:
      - Ett enskilt hemmaförsök säger inget om din risk, men upprepade försök med samma upplägg kan visa hur
        du förändras.
      - Du har förhöjd risk för hjärt-kärlsjukdom och bör söka vård.
      - Resultatet visar att du har dålig kondition.
      - Resultatet är meningslöst, eftersom pulsåterhämtning inte har något med kondition att göra.
    ratt: 1
    forklaring: >-
      Sambanden gäller grupper och standardiserade arbetsprov, inte ett enskilt försök hemma. Däremot finns
      ett samband mellan kondition och återgångens hastighet, så upprepade mätningar under samma förhållanden
      kan vara intressanta.

  - id: promenad-utan-effekt
    typ: situation
    fraga: >-
      Du tar en femminuterspromenad tre dagar i rad. Två dagar känner du dig piggare efteråt, en dag ingen
      skillnad. Hur stämmer det med forskningen?
    alternativ:
      - Det tyder på att promenaden inte har någon egentlig effekt för dig.
      - Det stämmer väl med forskningen, eftersom effekten finns i genomsnitt men varierar mellan personer och
        tillfällen.
      - Det visar att promenaden var för kort för att ge någon effekt.
      - Det visar att effekten bara uppträder om man promenerar utomhus.
    ratt: 2
    forklaring: >-
      Ett enda pass rörelse förbättrar i genomsnitt stämningen, men effekten är inte densamma varje gång. Tre
      dagar är för lite för att dra slutsatser åt något håll.

  - id: utvardera-rorelsepaus
    typ: tillampning
    fraga: >-
      Du vill ta reda på om en rörelsepaus på eftermiddagen hjälper dig. Vilka inslag gör utvärderingen mer
      tillförlitlig?
    alternativ:
      - Ta rörelsepausen när du känner för det och notera hur du mår efteråt.
      - Ta en rörelsepaus en gång och jämför med hur du minns att du brukar må.
      - Skatta energi och stämning före och efter, vid samma tid i flera dagar.
      - Jämför med lika långa pauser utan rörelse.
    ratt: [ 3, 4 ]
    forklaring: >-
      Skattningar före och efter under flera dagar gör det möjligt att se ett mönster, och jämförelsen med
      vanliga pauser visar om det är rörelsen eller själva pausen som gör skillnad. Att ta pausen när man
      känner för det eller jämföra med hur man minns att man brukar må ger osäkra resultat.
