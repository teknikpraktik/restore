# Självtest för 1.8 Din egen normala variation.

fragor:
  - id: varfor-variation
    typ: forstaelse
    fraga: >-
      Du mäter pulsen tre gånger i rad i vila och får 62, 68 och 65. Vilka två saker förklarar enligt kapitlet
      skillnaderna?
    alternativ:
      - Att du blev mer avslappnad för varje mätning och att klockan värmdes upp.
      - Mätfel och verklig variation i kroppen.
      - Att pulsen alltid sjunker vid upprepade mätningar och att du rörde dig.
      - Dagsform och vilken arm du mätte på.
    ratt: 2
    forklaring: >-
      Varje mätning har ett visst fel, och pulsen varierar på riktigt från ett andetag till nästa. Skillnader
      på några slag är därför väntade.

  - id: meningsfull-skillnad
    typ: slutsats
    fraga: >-
      Dina vilopulsmätningar under en vecka ligger mellan 58 och 66. En morgon får du 63. Vilka påståenden
      stämmer?
    alternativ:
      - Det är högre än ditt lägsta värde och tyder på sämre återhämtning.
      - Det är lägre än ditt högsta värde och tyder på bättre återhämtning.
      - För att tyda på en förändring skulle ett värde behöva ligga tydligt utanför 58–66.
      - Det ligger inom din normala variation och säger inget om en förändring.
    ratt: [ 3, 4 ]
    forklaring: >-
      En skillnad måste vara större än den normala variationen för att betyda något. 63 ligger mitt i det egna
      spannet och säger inget om återhämtningen åt något håll.

  - id: baslinje-mot-tabell
    typ: tillampning
    fraga: >-
      En app anger att din vilopuls ligger högre än genomsnittet för din ålder. Hur är det klokast att använda
      den uppgiften?
    alternativ:
      - Följa dina egna värden över tid under likartade förhållanden, eftersom genomsnitt inte visar var du
        normalt ligger.
      - Se det som ett tecken på dålig kondition och öka träningen.
      - Bortse från alla mätningar, eftersom de ändå varierar.
      - Mäta flera gånger om dagen tills värdet når genomsnittet.
    ratt: 1
    forklaring: >-
      Genomsnitt bygger på många personer och säger lite om din baslinje. Egna värden över tid är mer
      informativa. En mätning flera gånger om dagen ger inte bättre information.

  - id: dalig-natt
    typ: situation
    fraga: >-
      Du har sovit dåligt två nätter av sju och känner dig trött de dagarna. Vilken slutsats har bäst stöd?
    alternativ:
      - Sömnen har försämrats och bör följas upp med daglig mätning.
      - Två sämre nätter av sju ryms troligen inom den normala variationen; ett mönster över längre tid säger
        mer.
      - Tröttheten beror på att du har för låg baslinje.
      - Du bör söka vård för sömnproblem.
    ratt: 2
    forklaring: >-
      Enstaka sämre nätter är vanliga. Först om sömn och energi är sämre än vanligt under en längre period
      finns skäl att uppmärksamma det.

  - id: monster-och-orsak
    typ: slutsats
    fraga: >-
      Under en vecka ser du att energin var lägre de dagar du hade sovit sämre. Vilka slutsatser är rimliga?
    alternativ:
      - Att sömnen är orsaken till din låga energi.
      - Något tredje, till exempel en stressig period, kan ha påverkat både sömn och energi.
      - Att sambandet är en hypotes värd att pröva vidare, men att det ännu inte visar vad som orsakar vad.
      - Att sambandet är slumpmässigt och kan bortses från.
    ratt: [ 2, 3 ]
    forklaring: >-
      Att två saker varierar samtidigt visar inte vilken som påverkar vilken, eller om något tredje påverkar
      båda. Sambandet är en rimlig hypotes att pröva vidare, men inte ett bevis.
