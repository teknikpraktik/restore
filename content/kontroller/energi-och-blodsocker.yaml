# Självtest för 1.5 Energi, hunger och blodsocker.

fragor:
  - id: stabilt-trots-liten-reserv
    typ: forstaelse
    fraga: >-
      Blodet innehåller bara omkring fyra gram glukos, och hjärnan skulle förbruka det på under en timme.
      Varför sjunker blodsockret ändå inte stadigt mellan måltiderna?
    alternativ:
      - Hjärnan växlar till fett som bränsle så fort blodsockret sjunker.
      - Levern frisätter glukos löpande, och upptaget i vävnaderna regleras.
      - Musklerna lämnar tillbaka socker till blodet när hjärnan behöver det.
      - Insulin frisätts mellan måltiderna och höjer blodsockret.
    ratt: 2
    forklaring: >-
      Reserven i blodet är liten men fylls hela tiden på från levern. Insulin sänker blodsockret; det är
      glukagon som får levern att frisätta socker.

  - id: insulin-och-glukagon
    typ: forstaelse
    fraga: Vilka påståenden om insulin och glukagon stämmer?
    alternativ:
      - Båda höjer blodsockret, men på olika sätt.
      - Insulin frisätts när blodsockret sjunker och glukagon när det stiger.
      - Insulin frisätts vid högt blodsocker och får cellerna att ta upp socker.
      - Glukagon frisätts vid lågt blodsocker och får levern att frisätta socker.
    ratt: [ 3, 4 ]
    forklaring: >-
      De två hormonerna verkar i motsatt riktning och bildar tillsammans en negativ återkoppling som håller
      blodsockret inom gränser. Insulin sänker blodsockret, glukagon höjer det.

  - id: irriterad-fore-lunch
    typ: situation
    fraga: >-
      En kollega är kort i tonen och har svårt att fokusera vid elvatiden. Hen åt frukost klockan sex. Vilka
      förklaringar är rimliga att överväga?
    alternativ:
      - Hen är stressad över arbetsuppgifterna.
      - Hen har sovit dåligt.
      - Hen har lågt blodsocker på grund av en allvarlig ämnesomsättningsstörning.
      - Hen är hungrig; sjunkande blodsocker kan märkas som irritation och koncentrationssvårigheter.
    ratt: [ 1, 2, 4 ]
    forklaring: >-
      Hunger, stress och sömnbrist kan alla ge irritation och koncentrationssvårigheter, och hunger förväxlas
      lätt med stress. Fem timmar efter frukost är hunger den enklaste förklaringen att pröva först. En
      allvarlig ämnesomsättningsstörning är osannolik hos en frisk person.

  - id: ordning-pa-signaler
    typ: slutsats
    fraga: >-
      I försök där blodsockret sänks stegvis reagerar kroppen först med hormoner, sedan med kännbara tecken
      och sist med försämrad koncentration. Vad följer av det?
    alternativ:
      - Att den som inte känner sig darrig inte heller kan ha nedsatt koncentration av hunger.
      - Att kroppen oftast hinner rätta till ett sjunkande blodsocker innan man märker något, och att märkbara
        tecken kommer som ett senare steg.
      - Att koncentrationssvårigheter alltid är det första tecknet på hunger.
      - Att hormonerna inte har någon effekt förrän man känner sig darrig.
    ratt: 2
    forklaring: >-
      Ordningen visar en hierarki: hormonerna rättar till först, kännbara tecken fungerar som varning och
      koncentrationen påverkas sist. Det första alternativet stämmer inte, eftersom stegen kan märkas olika
      hos olika personer.

  - id: planera-kravande-dag
    typ: tillampning
    fraga: >-
      Du har möten från klockan ett till fem utan paus och brukar vara som mest lättirriterad sent på
      eftermiddagen. Vilket upplägg är bäst förankrat i kapitlet?
    alternativ:
      - Planera ett mellanmål före de sista mötena och jämför sedan koncentration och humör med en vanlig
        sådan dag.
      - Ät en extra stor lunch så att energin räcker hela eftermiddagen.
      - Hoppa över lunchen för att undvika trötthet efter maten.
      - Drick kaffe före varje möte, eftersom koffein ersätter energin från mat.
    ratt: 1
    forklaring: >-
      Ett mellanmål före de mest krävande timmarna är ett enkelt experiment, och jämförelsen med en vanlig dag
      gör det möjligt att se om det hjälper. Koffein ger inte energi i form av bränsle.
