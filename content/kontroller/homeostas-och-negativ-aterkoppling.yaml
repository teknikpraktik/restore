# Självtest för 1.1 Kroppen håller sig i balans.
# ratt anger numret på rätt alternativ (1 = första). 4 av 5 rätt markerar kapitlet som klart.

fragor:
  - id: svettning-i-varmt-rum
    typ: situation
    fraga: Du kommer in i ett varmt rum och börjar svettas efter en stund. Vad är det mest rimliga sättet att
      förstå det?
    alternativ:
      - Svettningen är ett tecken på att du är stressad.
      - Kroppen har märkt att det blivit varmare och kyler sig själv.
      - Kroppen har förlorat kontrollen över temperaturen.
      - Svettningen beror på att du har druckit för lite.
    ratt: 2
    forklaring: >-
      Svettning är ett av kroppens sätt att göra sig av med värme när det blir varmt. Det är ett exempel på
      homeostas: kroppen känner av en förändring och svarar så att temperaturen hålls stabil.

  - id: negativ-aterkoppling
    typ: forstaelse
    fraga: Vad betyder det att en reglering i kroppen sker genom negativ återkoppling?
    alternativ:
      - Att kroppen svarar i motsatt riktning mot förändringen, så att värdet förs tillbaka.
      - Att regleringen har en negativ effekt på hälsan.
      - Att kroppen förstärker förändringen tills den är klar.
      - Att regleringen bara fungerar när man vilar.
    ratt: 1
    forklaring: >-
      Negativ betyder här att svaret motverkar förändringen: blir det för varmt kyler kroppen, blir det för
      kallt värmer den. Ordet säger inget om att något är dåligt.

  - id: puls-vid-uppresning
    typ: slutsats
    fraga: Din puls ökar några sekunder efter att du har rest dig upp från soffan. Vilken slutsats är mest rimlig?
    alternativ:
      - Hjärtat arbetar för hårt och du bör vila mer.
      - Du är troligen stressad.
      - Pulsen borde vara densamma oavsett kroppsställning.
      - Kroppen höjer pulsen för att hålla blodtrycket stabilt när blod samlas i benen.
    ratt: 4
    forklaring: >-
      När du reser dig sjunker blodtrycket en kort stund. Kroppen ökar pulsen för att hålla blodtrycket uppe.
      Det är blodtrycket som hålls stabilt, och pulsen är ett av verktygen. En pulsökning vid uppresning är
      därför normal.

  - id: normal-temperatur
    typ: forstaelse
    fraga: Din temperatur i munnen är 36,3 grader en morgon. Vad är mest rimligt att tänka?
    alternativ:
      - Värdet är för lågt, eftersom normal temperatur är 37 grader.
      - Termometern måste vara trasig.
      - Värdet ligger inom det normala spannet, som varierar mellan personer och över dygnet.
      - Kroppen har slutat reglera temperaturen.
    ratt: 3
    forklaring: >-
      Normal temperatur är ett spann, inte en exakt siffra. I ett stort material låg friska personers
      temperatur i munnen oftast mellan ungefär 35,7 och 37,3 grader, och den är lägre på morgonen än på
      kvällen.

  - id: tillampa-hjartklappning
    typ: tillampning
    fraga: >-
      Efter en brådskande promenad till bussen slår hjärtat hårt. Vilket sätt att hantera det stämmer bäst med
      det du har läst i kapitlet?
    alternativ:
      - Mät pulsen upprepade gånger tills den är exakt som i vila.
      - Se det som kroppens svar på ansträngningen och lägg märke till hur det lugnar sig.
      - Undvika att gå fort i framtiden.
      - Försöka stoppa hjärtklappningen genom att hålla andan.
    ratt: 2
    forklaring: >-
      Snabb puls efter ansträngning är kroppens normala sätt att ge musklerna mer syre. Att lägga märke till
      hur den lugnar sig visar att regleringen fungerar. Att hålla andan är inte en metod som kursen
      rekommenderar.
