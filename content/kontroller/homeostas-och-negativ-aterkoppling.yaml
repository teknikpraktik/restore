# Självtest för 1.1 Kroppen håller sig i balans.
# ratt anger numret på rätt alternativ (1 = första). Alla svar måste vara rätta för grön bock.

fragor:
  - id: reglerat-varde
    typ: forstaelse
    fraga: >-
      När du går i en trappa ökar både puls och andning tydligt. Vilket påstående beskriver bäst vad kroppen
      håller stabilt i den situationen?
    alternativ:
      - Pulsen, som kroppen försöker hålla på vilonivå trots ansträngningen.
      - Syretillförseln till musklerna och blodtrycket, som upprätthålls genom att puls och andning ändras.
      - Andningsfrekvensen, som anpassas för att pulsen ska kunna hållas konstant.
      - Ingenting; under ansträngning upphör homeostasen tillfälligt.
    ratt: 2
    forklaring: >-
      Puls och andning är verktyg som ändras för att andra storheter, som syretillförsel och blodtryck, ska
      hållas inom fungerande gränser. Homeostasen upphör inte under ansträngning; den kräver tvärtom stora
      justeringar.

  - id: negativ-aterkoppling
    typ: forstaelse
    fraga: Vilka av följande är exempel på negativ återkoppling?
    alternativ:
      - Blodsockret stiger efter en måltid, insulin frisätts och blodsockret sjunker tillbaka.
      - Du blir orolig, märker hjärtklappningen och blir ännu mer orolig.
      - Blodsockret sjunker och du känner dig nedstämd.
      - Kroppstemperaturen stiger, du börjar svettas och avdunstningen kyler kroppen.
    ratt: [ 1, 4 ]
    forklaring: >-
      Vid negativ återkoppling motverkar svaret förändringen: högt blodsocker leder till insulin som sänker
      det, och stigande temperatur leder till svett som kyler. Oro som förstärks av hjärtklappning är
      motsatsen, ett förlopp som förstärker sig självt. Att bli nedstämd av lågt blodsocker är inget svar som
      för tillbaka värdet.

  - id: kalla-fingrar-och-svett
    typ: situation
    fraga: >-
      En kall dag går du raskt till jobbet. Väl framme är fingrarna kalla men du svettas om ryggen. Hur kan
      det förstås?
    alternativ:
      - Temperaturregleringen fungerar dåligt, eftersom kroppen gör två motsatta saker samtidigt.
      - Svettningen beror på stress och har inget med temperaturen att göra.
      - Olika delar av temperaturregleringen svarar på olika signaler – kall hud på händerna och värme inne i
        kroppen från ansträngningen.
      - Fingrarna är kalla för att blodet behövs i benmusklerna.
    ratt: 3
    forklaring: >-
      Kroppen kan samtidigt spara värme i huden på händerna, som utsätts för kyla, och avge värme genom svett
      eftersom ansträngningen höjt temperaturen inne i kroppen. Regleringen består av flera delar som reagerar
      på olika signaler.

  - id: normalspann
    typ: slutsats
    fraga: >-
      Två friska personer mäter temperaturen i munnen samma morgon. Den ena har 36,1 grader, den andra 36,9.
      Vilka slutsatser är rimliga?
    alternativ:
      - Den med 36,1 grader har sannolikt en för låg ämnesomsättning.
      - Den med 36,9 grader har sannolikt en lätt infektion.
      - Båda kan ha högre temperatur senare på dagen än på morgonen.
      - Båda värdena kan vara normala; personer skiljer sig systematiskt inom ett normalspann.
    ratt: [ 3, 4 ]
    forklaring: >-
      Normal temperatur är ett spann, ungefär 35,7–37,3 grader i munnen hos friska vuxna, och personer skiljer
      sig systematiskt från varandra. Temperaturen är dessutom lägre på morgonen än senare på dagen. Ingen av
      skillnaderna behöver tyda på sjukdom.

  - id: tolka-hjartklappning
    typ: tillampning
    fraga: >-
      Efter en brådskande promenad till bussen slår hjärtat hårt i flera minuter. Vad är den mest rimliga
      tolkningen utifrån kapitlet?
    alternativ:
      - Regleringen arbetar; hjärtat håller blodflödet uppe medan kroppen återhämtar sig efter ansträngningen.
      - Ett tecken på att återhämtningen är för långsam och att konditionen är dålig.
      - Ett tecken på att kroppen inte klarar plötsliga förändringar.
      - Ett tecken på stress, eftersom pulsen borde vara tillbaka direkt.
    ratt: 1
    forklaring: >-
      Förhöjd puls en stund efter ansträngning är regleringen i arbete. Det tar några minuter innan kroppen är
      tillbaka i viloläge. Ett enskilt tillfälle säger inget om konditionen.
