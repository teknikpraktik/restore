# Självtest för 1.2 Kroppen förbereder sig i förväg.

fragor:
  - id: framat-eller-ater
    typ: forstaelse
    fraga: Vilka av följande är framåtkoppling snarare än negativ återkoppling?
    alternativ:
      - Du börjar svettas efter tio minuters löpning.
      - Pulsen stiger när du ställer dig vid startlinjen inför ett lopp.
      - Saliv och magsaft frisätts när du ser och känner doften av mat.
      - Pulsen ökar när du reser dig och blodtrycket sjunker.
    ratt: [ 2, 3 ]
    forklaring: >-
      Vid startlinjen och inför en måltid reagerar kroppen på det den förväntar sig. Svettning efter tio
      minuters löpning och pulsökning när blodtrycket har sjunkit är svar på förändringar som redan har
      inträffat.

  - id: syfte-med-forberedelse
    typ: forstaelse
    fraga: Vad är huvudsyftet med att kroppen reagerar i förväg?
    alternativ:
      - Att varna för att situationen är farlig.
      - Att ersätta den vanliga återkopplingen, som är för långsam för att fungera.
      - Att minska den avvikelse som uppstår när händelsen väl inträffar.
      - Att öka prestationen genom att hålla kroppen aktiverad så länge som möjligt.
    ratt: 3
    forklaring: >-
      Förberedelsen gör att avvikelsen blir mindre när händelsen kommer. Den ersätter inte återkopplingen, som
      rättar till det om förutsägelsen var fel, och den säger inget om att situationen är farlig.

  - id: reaktion-som-klingar-av
    typ: situation
    fraga: >-
      Inför en presentation har du hjärtklappning och torr mun. Efter fem minuter av presentationen har det
      lagt sig. Vilken förklaring stämmer bäst?
    alternativ:
      - När situationen pågår får kroppen ny information och anpassar nivån efter det som faktiskt krävs.
      - Hjärtklappningen avtog eftersom stresshormonerna tog slut.
      - Kroppen blev uttröttad och kunde inte längre upprätthålla reaktionen.
      - Reaktionen avtog eftersom presentationen var lättare än du hade trott, annars hade den fortsatt.
    ratt: 1
    forklaring: >-
      Förberedelsen bygger på förväntningar. När situationen pågår justerar kroppen efter det verkliga
      behovet. Det gäller även när uppgiften är krävande; reaktionen minskar inte bara för att den var lätt.

  - id: oro-utan-handelse
    typ: slutsats
    fraga: >-
      En person ligger vaken och tänker på ett svårt samtal nästa vecka och märker att hjärtat slår snabbare.
      Vilken slutsats är mest rimlig?
    alternativ:
      - Reaktionen visar att samtalet kommer att gå dåligt.
      - Reaktionen är skadlig och bör stoppas innan den påverkar hälsan.
      - Kroppen reagerar bara så om personen har en ångestsjukdom.
      - Kroppen förbereder sig för en föreställd situation; det är normalt men tröttande om det upprepas ofta.
    ratt: 4
    forklaring: >-
      Förberedande reaktioner kan utlösas av tankar på något som inte har hänt. Det är en normal mekanism. Den
      är inte skadlig i sig, men upprepad under lång tid blir den en belastning.

  - id: skilja-ut-symtom
    typ: tillampning
    fraga: >-
      Vilka av följande iakttagelser passar inte in på en vanlig förberedande reaktion och bör bedömas av
      vården?
    alternativ:
      - Svimning när du står i en kö utan att något särskilt har hänt.
      - Illamående och tryck i magen kvällen före en tentamen.
      - Svettiga händer och snabb andning när du väntar på besked om ett jobb.
      - Tryck över bröstet och andnöd när du sitter stilla en vanlig kväll.
    ratt: [ 1, 4 ]
    forklaring: >-
      Illamående före en tentamen och svettiga händer i väntan på besked är kopplade till en förväntad
      händelse och klingar av. Svimning och tryck över bröstet med andnöd i vila saknar en sådan koppling.
