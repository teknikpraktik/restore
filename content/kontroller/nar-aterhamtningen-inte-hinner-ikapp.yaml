# Självtest för 1.7 När återhämtningen inte hinner ikapp.

fragor:
  - id: problemets-karna
    typ: forstaelse
    fraga: När blir påfrestningar oftast ett problem för kroppen?
    alternativ:
      - Så fort man upplever någon form av stress.
      - Bara när det handlar om fysisk ansträngning.
      - Aldrig, kroppen anpassar sig alltid.
      - När de kommer så tätt att återhämtningen inte hinner ikapp.
    ratt: 4
    forklaring: >-
      Enstaka påfrestningar är normala och kroppen återhämtar sig från dem. Problemet uppstår när de följer så
      tätt att kroppen inte hinner tillbaka mellan gångerna.

  - id: tidigt-tecken
    typ: situation
    fraga: >-
      Under de senaste veckorna har du svårare att somna, blir lättare irriterad och känner att helgen inte
      räcker för att vila upp dig. Vad är mest rimligt?
    alternativ:
      - Det är bevis på att du har en sjukdom.
      - Det är normalt och inget att tänka på.
      - Det kan vara tecken på att återhämtningen inte räcker, och värt att se över balansen.
      - Det går över om du arbetar hårdare.
    ratt: 3
    forklaring: >-
      Sämre sömn, irritation och vila som inte räcker är vanliga tidiga tecken på att återhämtningen inte
      hinner ikapp. De kan ha andra orsaker och är inte en diagnos, men tillsammans är de en signal att se
      över balansen.

  - id: aktiv-aterhamtning
    typ: forstaelse
    fraga: Vilket påstående om återhämtning stämmer bäst?
    alternativ:
      - Återhämtning betyder alltid att ligga still.
      - Återhämtning kan också vara aktiv, till exempel rörelse eller umgänge, och ser olika ut för olika
        personer.
      - Återhämtning sker bara under sömnen.
      - Det som fungerar för en person fungerar för alla.
    ratt: 2
    forklaring: >-
      Många återhämtar sig lika bra av att röra sig, träffa någon eller göra något med händerna som av att
      vila. Det viktiga är att hitta vad som ger energi för just dig.

  - id: nar-hjalp
    typ: tillampning
    fraga: I vilken situation är det rimligt att kontakta vårdcentralen eller 1177?
    alternativ:
      - Du har under flera veckor varit så trött att det är svårt att klara vardagen och sover dåligt nästan
        varje natt.
      - Du var trött efter en lång arbetsdag men piggare nästa morgon.
      - Du kände dig spänd före ett möte.
      - Du blev andfådd när du sprang till bussen.
    ratt: 1
    forklaring: >-
      Långvarig trötthet som påverkar vardagen, sömnproblem nästan varje natt eller nedstämdhet under lång tid
      är skäl att söka hjälp. Trötthet efter en lång dag och reaktioner inför ett möte är normala.

  - id: planera-aterhamtning
    typ: tillampning
    fraga: Du ser att torsdag kommer att bli veckans tyngsta dag. Vad stämmer bäst med kapitlet?
    alternativ:
      - Fylla torsdagskvällen med fler uppgifter så att du hinner mer.
      - Vänta med återhämtning till semestern.
      - Hoppa över sömn för att hinna förbereda dig.
      - Planera in något som brukar ge dig energi efter torsdagen, även om det är kort.
    ratt: 4
    forklaring: >-
      Återhämtning behöver inte vara lång för att göra skillnad. Att planera in något som ger energi efter en
      tung dag är ett konkret sätt att hjälpa balansen.
