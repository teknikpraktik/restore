# Självtest för 1.7 När återhämtningen inte hinner ikapp.

fragor:
  - id: var-problemet-uppstar
    typ: forstaelse
    fraga: Vad avgör enligt kapitlet främst om påfrestningar blir ett problem?
    alternativ:
      - Hur kraftig varje enskild påfrestning är.
      - Om påfrestningarna är psykiska eller fysiska.
      - Hur mycket man oroar sig för påfrestningarna i förväg.
      - Om återhämtningen hinner ikapp mellan påfrestningarna.
    ratt: 4
    forklaring: >-
      Även kraftiga enskilda påfrestningar är kroppen rustad för. Problemen uppstår när de följer så tätt att
      kroppen inte hinner tillbaka, eller när reaktionen inte klingar av mellan gångerna.

  - id: monster-av-tecken
    typ: situation
    fraga: >-
      En person har under en månad sovit sämre, blivit lättare irriterad och upplever att helgerna inte räcker
      för att hämta sig. Vilken bedömning stämmer bäst med kapitlet?
    alternativ:
      - Tecknen är var för sig vanliga, men tillsammans och över tid är de en signal att se över balansen.
      - Det rör sig sannolikt om utmattningssyndrom.
      - Det är normala variationer som inte behöver uppmärksammas.
      - Det är tecken på att personen tränar för lite.
    ratt: 1
    forklaring: >-
      Kombinationen av flera tecken som håller i sig är det som är värt att notera. Kapitlet ger inget
      underlag för en diagnos, och tecknen kan ha andra orsaker.

  - id: aterhamtning-aktiv
    typ: slutsats
    fraga: >-
      En person blir piggare av att spela fotboll med vänner på kvällen, medan en kollega behöver lugn och
      ensamhet. Vilka slutsatser är rimliga?
    alternativ:
      - Kollegan återhämtar sig på rätt sätt, eftersom återhämtning kräver vila.
      - Fotbollen är ingen återhämtning, eftersom den är fysiskt krävande.
      - Återhämtning kan vara både aktiv och passiv, och vad som fungerar skiljer sig mellan personer.
      - Vad som räknas som återhämtning avgörs av effekten, inte av hur stillsam aktiviteten är.
    ratt: [ 3, 4 ]
    forklaring: >-
      Återhämtning kan vara både aktiv och passiv och skiljer sig mellan personer. Det som avgör är om
      aktiviteten ger energi. Fotbollen är återhämtning för den som blir piggare av den.

  - id: nar-soka-vard
    typ: tillampning
    fraga: Vilka situationer motiverar att kontakta vården?
    alternativ:
      - Trötthet efter en intensiv arbetsvecka som går över under helgen.
      - Svårt att varva ner kvällen efter en konflikt på jobbet.
      - Trötthet som i flera veckor gör vardagen svår att klara, tillsammans med sömnproblem nästan varje natt.
      - Nedstämdhet som inte har gått över på flera veckor.
    ratt: [ 3, 4 ]
    forklaring: >-
      Långvarig trötthet som påverkar vardagen, ihållande sömnproblem och nedstämdhet som inte går över är
      skäl att söka vård. Trötthet efter en intensiv vecka och svårt att varva ner efter en konflikt är
      kortvariga och har en tydlig orsak.

  - id: planera-efter-tung-dag
    typ: tillampning
    fraga: >-
      Torsdag ser ut att bli veckans tyngsta dag, och kvällen är fortfarande ledig. Vad stämmer bäst med
      kapitlet?
    alternativ:
      - Använda kvällen till att förbereda fredagen, så att den blir lättare.
      - Planera in något som brukar ge energi efter torsdagen och utvärdera efteråt om det gjorde skillnad.
      - Vänta med återhämtning till helgen, då den blir mer effektiv.
      - Lägga till ett träningspass, eftersom fysisk påfrestning alltid är bra.
    ratt: 2
    forklaring: >-
      Återhämtning som placeras där belastningen är som störst gör mest nytta, och utvärderingen gör det
      möjligt att se om den fungerar. Träning kan vara återhämtning för en del men är inte självklart rätt
      efter en tung dag.
