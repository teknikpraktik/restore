# Självtest för 1.3 Pulsen anpassar sig hela tiden.

fragor:
  - id: kedjan-vid-uppresning
    typ: forstaelse
    fraga: Vilken ordning beskriver bäst vad som händer under sekunderna efter att du har rest dig upp?
    alternativ:
      - Pulsen ökar, blodtrycket stiger, blodtryckssensorerna registrerar det och pulsen sjunker.
      - Blod samlas i benen, blodtrycket sjunker, blodtryckssensorerna signalerar mindre och pulsen ökar.
      - Benmusklerna behöver mer syre, hjärnan ökar pulsen och blodtrycket stiger.
      - Blodtrycket stiger av tyngdkraften, blodtryckssensorerna reagerar och pulsen ökar för att sänka det.
    ratt: 2
    forklaring: >-
      Tyngdkraften drar blod mot benen, så mindre blod återvänder till hjärtat och blodtrycket sjunker kort.
      Blodtryckssensorerna skickar färre signaler, och hjärnstammen svarar med högre puls och sammandragna
      kärl.

  - id: matmetod
    typ: tillampning
    fraga: >-
      Du vill veta om din vilopuls förändras under en period med regelbunden träning. Vilket upplägg ger mest
      jämförbara värden?
    alternativ:
      - Mäta varje kväll efter dagens sista måltid, eftersom det är då du har tid.
      - Mäta på morgonen, sittande efter en minuts vila och före kaffet, i 30 sekunder.
      - Mäta direkt efter varje träningspass, eftersom förändringen syns tydligast då.
      - Mäta vid olika tider varje dag, så att du får ett medelvärde över dygnet.
    ratt: 2
    forklaring: >-
      Jämförbara värden kräver likartade förhållanden. Morgon, samma kroppsställning, vila före mätningen och
      inget koffein minskar påverkan från dagens händelser. Längre räknetid minskar mätfelet.

  - id: rakna-fel
    typ: forstaelse
    fraga: >-
      Du räknar pulsen i 15 sekunder och multiplicerar med fyra. Vilka påståenden om mätningen stämmer?
    alternativ:
      - Varje slag du missar eller räknar för mycket ger ett fel på fyra slag per minut.
      - Felet blir mindre än om du räknar i 30 sekunder, eftersom pulsen hinner ändras mindre.
      - Räknar du i stället i 30 sekunder och multiplicerar med två halveras felet.
      - Ett missat slag påverkar resultatet med ett slag per minut.
    ratt: [ 1, 3 ]
    forklaring: >-
      Eftersom resultatet multipliceras med fyra blir varje räknefel fyra slag per minut. Med 30 sekunders
      räkning och multiplikation med två blir felet två slag. Ett missat slag påverkar alltså mer än ett slag
      per minut.

  - id: hog-puls-i-mote
    typ: slutsats
    fraga: >-
      Din pulsklocka visar 92 slag per minut under ett möte, mot vanligtvis runt 70 när du sitter still.
      Vilken slutsats har bäst stöd?
    alternativ:
      - Du är stressad, eftersom förhöjd puls i vila är ett mått på stress.
      - Klockan visar fel, eftersom pulsen inte stiger så mycket när man sitter.
      - Något har höjt pulsen, men det kan lika gärna vara kaffe, värme, en nyss avslutad promenad eller
        engagemang i samtalet.
      - Du har sannolikt en infektion på gång.
    ratt: 3
    forklaring: >-
      Pulsen påverkas av många faktorer. Ett förhöjt värde visar att något har förändrats, men inte vad.
      Pulsen ensam är inte ett mått på stress.

  - id: klockans-fel
    typ: tillampning
    fraga: >-
      Du vill jämföra pulsen före och omedelbart efter en kort intervall i trappan. Vilka egenskaper hos en
      pulsklocka på handleden kan ge en missvisande bild?
    alternativ:
      - Klockor mäter alltid för högt i vila.
      - Den mäter sämre när handen och armen rör sig mycket.
      - Den reagerar med fördröjning när pulsen ändras snabbt.
      - Klockor mäter blodtryck snarare än puls.
    ratt: [ 2, 3 ]
    forklaring: >-
      Optiska pulsmätare är oftast ganska noggranna i vila men sämre vid rörelse, och de reagerar med
      fördröjning vid snabba förändringar. Båda delarna gäller kring en kort intervall. De mäter inte för högt
      i vila och de mäter puls, inte blodtryck.
