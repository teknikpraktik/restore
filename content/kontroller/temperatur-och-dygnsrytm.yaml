# Självtest för 1.4 Temperatur och dygnets rytm.

fragor:
  - id: effektivaste-medlet
    typ: forstaelse
    fraga: >-
      Vilka av följande är sätt för kroppen att göra sig av med värme?
    alternativ:
      - Svettning.
      - Att muskelskakningar ökar.
      - Beteende, till exempel att ta av sig ett plagg eller söka skugga.
      - Att blodkärlen i huden vidgas.
    ratt: [ 1, 3, 4 ]
    forklaring: >-
      Svettning, att söka svalka och vidgade blodkärl i huden ökar värmeavgivningen. Muskelskakningar gör
      tvärtom: de ökar värmeproduktionen i kyla.

  - id: frysa-vid-feber
    typ: forstaelse
    fraga: >-
      När febern stiger fryser och skakar man ofta, trots att temperaturen redan är högre än normalt. Vilken
      förklaring stämmer?
    alternativ:
      - Infektionen stör temperatursinnet så att det felaktigt rapporterar kyla.
      - Kroppen har höjt den nivå den reglerar mot och värmer sig för att nå den.
      - Huden kyls av att svetten avdunstar, och det är den kylan man känner.
      - Kroppen har tillfälligt förlorat förmågan att reglera temperaturen.
    ratt: 2
    forklaring: >-
      Vid feber höjs målnivån. Den faktiska temperaturen är då lägre än målet, så kroppen drar ihop hudens
      kärl och skakar för att höja den. Feber är en aktiv reglering.

  - id: morgonvarde-kvallsvarde
    typ: slutsats
    fraga: >-
      Samma person mäter 36,3 grader klockan sju på morgonen och 37,1 grader klockan sex på kvällen, med samma
      termometer. Vilka förklaringar är rimliga?
    alternativ:
      - Skillnaden ligger inom vad dygnsrytmen och dagens aktivitet kan förklara.
      - Kvällsvärdet tyder på en begynnande infektion.
      - Morgonvärdet är för lågt och tyder på dålig sömn.
      - Dagens aktivitet kan ha bidragit till det högre kvällsvärdet.
    ratt: [ 1, 4 ]
    forklaring: >-
      Temperaturen är normalt lägst sent på natten och högre på eftermiddag och kväll, och aktivitet under
      dagen höjer den ytterligare. Skillnaden kräver varken infektion eller dålig sömn som förklaring.

  - id: kvallsmanniska
    typ: situation
    fraga: >-
      En kvällsmänniska har svårt att komma i gång tidigt på morgonen. Hur kan det förstås utifrån kapitlet?
    alternativ:
      - Kvällsmänniskor sover generellt sämre och behöver därför mer sömn.
      - Låg morgonenergi beror främst på att man har ätit för lite kvällen före.
      - Kvällsmänniskor har lägre kroppstemperatur hela dygnet.
      - Kroppens inre klocka ligger senare, så den lägsta punkten i dygnsrytmen inträffar närmare uppvaknandet.
    ratt: 4
    forklaring: >-
      Hos kvällsmänniskor inträffar temperaturens lägsta punkt senare på morgonen. När väckarklockan ringer
      befinner de sig därför tidigare i sin dygnsrytm än en morgonmänniska vid samma klockslag.

  - id: planering-efter-rytm
    typ: tillampning
    fraga: >-
      Du har en analysuppgift som kräver full koncentration och en rad rutinärenden. Du är piggast på
      förmiddagen. Vilket upplägg stämmer bäst med kapitlet?
    alternativ:
      - Rutinärendena först, så att förmiddagen blir fri från störningar efter lunch.
      - Analysen på förmiddagen och rutinärendena vid din tröttaste tid.
      - Varva dem varje halvtimme för att hålla vakenheten jämn.
      - Lägga analysen sent på kvällen, när kroppstemperaturen är som högst.
    ratt: 2
    forklaring: >-
      Vakenheten följer dygnsrytmen. Den mest krävande uppgiften passar bäst när du brukar vara piggast. Att
      kroppstemperaturen är hög på kvällen betyder inte att koncentrationen är bäst då för alla.
