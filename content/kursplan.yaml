        innehall: under-produktion
        kontroll: ej-producerad

  - id: fysisk-aktivitet
    titel: Rörelse som bygger kapacitet
    beskrivning: >-
      Vad som händer i kroppen under och efter fysisk aktivitet, hur kroppen anpassar sig av
      träning och hur aktivitet påverkar stress och sinnesstämning.
    mal:
      - Förstå hur regelbunden aktivitet ökar kroppens förmåga att hantera belastning.
      - Upptäcka hur kropp och stämning påverkas av olika slags rörelse.
      - Hitta en nivå och form av rörelse som du kan hålla fast vid över tid.
    kapitel:
      - id: energisystem-under-arbete
        titel: Energisystem under arbete
        beskrivning: >-
          Fosfokreatin, anaerob glykolys och oxidativ metabolism, deras kapacitet och effekt,
          och laktatets roll.
        forkunskaper: [energi-och-blodsocker, skelettmuskelns-kontraktion]
        larandemal:
          - Jämföra energisystemens maximala effekt och kapacitet.
          - Förklara varför laktat inte är orsak till muskeltrötthet i den enkla bemärkelsen.
          - Beskriva substratval vid olika arbetsintensitet.
        studietid: 90
        innehall: under-produktion
        kontroll: ej-producerad

      - id: kardiovaskulara-svar-pa-arbete
        titel: Kardiovaskulära svar på akut arbete
        beskrivning: >-
