        forkunskaper: [emotionsteorier]
        larandemal:
          - Beskriva processmodellens fem strategifamiljer.
          - Jämföra omvärdering och undertryckande med avseende på fysiologiska och subjektiva utfall.
          - Värdera effektstorlekar i metaanalyser av emotionsreglering.
        studietid: 75
        innehall: under-produktion
        kontroll: ej-producerad

      - id: kognitiv-vardering-och-stressrespons
        titel: Kognitiv värdering och stressrespons
        beskrivning: >-
