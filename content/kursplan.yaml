        beskrivning: >-
          Metaanalyser av social integration och dödlighet, effektstorlekar och problem med
          orsaksslutsatser.
        forkunskaper: [akut-och-langvarig-stress]
        larandemal:
          - Sammanfatta resultaten från metaanalyser om sociala relationer och dödlighet.
          - Skilja strukturella och funktionella mått på sociala relationer.
          - Förklara förväxlingsfaktorer och omvänd kausalitet i dessa studier.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: socialt-stod-och-stressbuffring
        titel: Socialt stöd och stressbuffring
        beskrivning: >-
          Experimentella studier av socialt stöd under laboratoriestress och buffringshypotesen.
        forkunskaper: [sociala-relationer-och-halsa]
        larandemal:
          - Beskriva buffringshypotesen.
          - Redogöra för experimentella resultat om stöd och kardiovaskulär reaktivitet.
          - Förklara varför oönskat stöd kan öka reaktiviteten.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: socialt-utvarderingshot
        titel: Socialt utvärderingshot och laboratoriestress
        beskrivning: >-
          Trier Social Stress Test, metaanalyser av vilka uppgiftsegenskaper som aktiverar
          HPA-axeln och vad det säger om stressresponsens orsaker.
        forkunskaper: [hpa-axeln]
        larandemal:
          - Beskriva TSST-protokollets komponenter.
          - Redogöra för betydelsen av okontrollerbarhet och social utvärdering för kortisolsvaret.
          - Värdera generaliserbarheten från laboratorium till vardag.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: oxytocin
        titel: Oxytocin – fysiologi och överdrivna påståenden
        beskrivning: >-
          Oxytocinets etablerade fysiologiska funktioner, studier av intranasalt oxytocin och
          replikationsproblem i forskningsfältet.
        forkunskaper: [cellular-kommunikation-och-hormoner]
        larandemal:
          - Beskriva oxytocinets roll vid förlossning och amning som exempel på positiv återkoppling.
          - Redogöra för metodproblem vid mätning av oxytocin i perifert blod.
          - Värdera evidensläget för beteendeeffekter av intranasalt oxytocin.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: ensamhet-och-social-isolering
        titel: Ensamhet och social isolering – mekanismer
        beskrivning: >-
          Skillnaden mellan objektiv isolering och upplevd ensamhet, och föreslagna
          beteendemässiga och fysiologiska mekanismer.
        forkunskaper: [sociala-relationer-och-halsa]
        larandemal:
          - Skilja social isolering från upplevd ensamhet.
          - Beskriva föreslagna mekanismer via sömn, stressystem och hälsobeteenden.
          - Redogöra för evidensen från interventionsstudier mot ensamhet.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: fysiologisk-synkronisering
        titel: Fysiologisk synkronisering mellan människor
        beskrivning: >-
          Studier av samvariation i hjärtfrekvens, andning och hudkonduktans mellan personer i
          interaktion, och de metodologiska fallgroparna.
        forkunskaper: [hjartfrekvens-och-hrv]
        larandemal:
          - Beskriva hur fysiologisk synkronisering mäts.
          - Förklara varför gemensamma yttre faktorer kan ge skensynkronisering.
          - Värdera tolkningar av synkronisering som tecken på social samhörighet.
        studietid: 45
        innehall: under-produktion
        kontroll: ej-producerad

  - id: beteendeforandring
    titel: Beteendeförändring och vanebildning
    beskrivning: >-
      Inlärningspsykologins grunder, vanors automatik, motivation, planering och
      självmonitorering, och evidensläget för olika beteendeförändringstekniker.
    kapitel:
      - id: klassisk-och-operant-betingning
        titel: Klassisk och operant betingning
        beskrivning: >-
          Associativ inlärning, förstärkningsscheman och hur konsekvenser formar beteende.
        forkunskaper: [neuroplasticitet]
        larandemal:
          - Skilja klassisk och operant betingning.
          - Beskriva förstärkningsscheman och deras effekt på beteendets stabilitet.
          - Förklara dopaminets roll som prediktionsfelsignal.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: vanor-och-automatik
        titel: Vanor – automatik och kontextberoende
        beskrivning: >-
          Vanor som kontextutlösta automatiska beteenden, studier av vanebildningens tidsförlopp
          och skillnaden mellan vana och målstyrt beteende.
        forkunskaper: [klassisk-och-operant-betingning]
        larandemal:
          - Definiera vana i psykologisk mening.
          - Redogöra för empiriska data om hur lång tid vanebildning tar.
          - Förklara kontextens roll i både bildning och brytning av vanor.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: motivation-och-malsattning
        titel: Motivation och målsättning
        beskrivning: >-
          Självbestämmandeteori, målsättningsteori och skillnaden mellan intention och
          beteende.
        forkunskaper: [vanor-och-automatik]
        larandemal:
          - Beskriva självbestämmandeteorins motivationsformer.
          - Redogöra för intention–beteendegapet.
          - Förklara egenskaper hos mål som ökar sannolikheten att de uppnås.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: genomforandeintentioner
        titel: Genomförandeintentioner och planering
        beskrivning: >-
          Om–så-planer, deras verkningsmekanism och metaanalytiska effektstorlekar.
        forkunskaper: [motivation-och-malsattning]
        larandemal:
          - Formulera en korrekt genomförandeintention.
          - Förklara den föreslagna mekanismen med automatiserad stimulusrespons.
          - Sammanfatta effektstorlekar och begränsningar.
        studietid: 45
        innehall: under-produktion
        kontroll: ej-producerad

      - id: sjalvmonitorering-och-aterkoppling
        titel: Självmonitorering och återkoppling
        beskrivning: >-
          Registrering av eget beteende och fysiologiska mått som förändringsteknik, och
          reaktivitet hos mätning.
        forkunskaper: [genomforandeintentioner]
        larandemal:
          - Beskriva självmonitorering som beteendeförändringsteknik.
          - Förklara mätreaktivitet.
          - Värdera evidensen för aktivitetsmätare som stöd för beteendeförändring.
        studietid: 45
        innehall: under-produktion
        kontroll: ej-producerad

      - id: beteendeforandringstekniker
        titel: Beteendeförändringstekniker och deras evidensläge
        beskrivning: >-
          Taxonomier över beteendeförändringstekniker, hur de används i forskning och vilka
          som har bäst stöd.
        forkunskaper: [sjalvmonitorering-och-aterkoppling]
        larandemal:
          - Beskriva syftet med en standardiserad taxonomi över tekniker.
          - Redogöra för tekniker med starkast stöd för fysisk aktivitet.
          - Förklara varför effekter av enskilda tekniker är svåra att isolera.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: aterfall-och-vidmakthallande
        titel: Återfall och vidmakthållande
        beskrivning: >-
          Varför förändringar ofta inte består, modeller för återfall och strategier för
          vidmakthållande.
        forkunskaper: [vanor-och-automatik]
        larandemal:
          - Beskriva återfall som en förväntad del av beteendeförändring.
          - Redogöra för skillnaden mellan initiering och vidmakthållande.
          - Planera för högriskssituationer med hjälp av kontextanalys.
        studietid: 45
        innehall: under-produktion
        kontroll: ej-producerad

  - id: integration
    titel: Praktisk integration och individuella protokoll
    beskrivning: >-
      Hur kunskapen från kursen omsätts i systematiska egenexperiment och långsiktiga protokoll,
      med vetenskapliga metoder för att undvika felaktiga slutsatser om den egna kroppen.
    kapitel:
      - id: testbara-fragor
        titel: Att formulera en testbar fråga om den egna funktionen
        beskrivning: >-
          Från allmän nyfikenhet till en avgränsad fråga med definierad exponering, utfall och
          tidsram.
        forkunskaper: [biologisk-variation-och-referensintervall]
        larandemal:
          - Formulera en fråga med tydlig exponering och tydligt utfallsmått.
          - Skilja mekanistiska frågor från effektfrågor.
          - Bedöma om en fråga är möjlig att besvara med egna mätningar.
        studietid: 45
        innehall: under-produktion
        kontroll: ej-producerad

      - id: matmetoder-for-egenexperiment
        titel: Mätmetoder för egenexperiment
        beskrivning: >-
          Val av mått, reliabilitet och validitet, standardisering av mätsituationen och
          användning av konsumentprodukter.
        forkunskaper: [testbara-fragor]
        larandemal:
          - Välja mått med hänsyn till reliabilitet och validitet.
          - Standardisera tidpunkt, position och förhållanden vid mätning.
          - Värdera konsumentprodukters mätprecision.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: n-of-1-design
        titel: N-of-1-design – baslinje, intervention och uppföljning
        beskrivning: >-
          Upplägg för experiment med en individ: ABA- och växlingsdesign, randomisering av
          perioder och utsläckningstid.
        forkunskaper: [matmetoder-for-egenexperiment]
        larandemal:
          - Beskriva ABA- och ABAB-design.
          - Förklara varför baslinjens längd och stabilitet är avgörande.
          - Planera ett eget experiment med randomiserad periodordning.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: tolkning-av-egna-data
        titel: Tolkning av egna data – variation, regression mot medelvärdet och förväntan
        beskrivning: >-
          Systematiska felkällor vid tolkning av egna mätningar och enkla statistiska verktyg för
          att bedöma förändring.
        forkunskaper: [n-of-1-design]
        larandemal:
          - Förklara regression mot medelvärdet med ett räkneexempel.
          - Redogöra för förväntanseffekter vid icke-blindade egenexperiment.
          - Använda medelvärde, standardavvikelse och minsta meningsfulla förändring.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: individuellt-traningsprotokoll
        titel: Att bygga ett individuellt träningsprotokoll
        beskrivning: >-
          Sammanställning av övningar från kursen till ett protokoll med syfte, dos, progression
          och uppföljningsmått.
        forkunskaper: [traningsprinciper, n-of-1-design]
        larandemal:
          - Specificera ett protokoll med syfte, frekvens, intensitet och duration.
          - Planera progression utifrån överbelastningsprincipen.
          - Välja uppföljningsmått som är kopplade till protokollets syfte.
        studietid: 60
        innehall: under-produktion
        kontroll: ej-producerad

      - id: langsiktig-uppfoljning
        titel: Långsiktig uppföljning och revidering
        beskrivning: >-
          Hur protokoll utvärderas över månader, när de bör ändras och hur egna erfarenheter
          vägs mot forskningsläget.
        forkunskaper: [individuellt-traningsprotokoll, tolkning-av-egna-data]
        larandemal:
          - Planera uppföljning med fasta utvärderingspunkter.
          - Avgöra när en förändring är tillräckligt stor för att motivera en revidering.
          - Väga individuella resultat mot evidens från kontrollerade studier.
        studietid: 45
        innehall: under-produktion
        kontroll: ej-producerad
