        forkunskaper: [arbetsminne-och-exekutiva-funktioner, sympatiko-adrenomedullara-systemet]
        larandemal:
          - Förklara det inverterade U-sambandet mellan katekolaminnivå och arbetsminne.
          - Redogöra för djurexperimentella och humana belägg.
          - Skilja kortvariga från långvariga effekter av stress på kognition.
