      Vad som styr när vi blir sömniga och pigga, vad sömnen gör för kropp och hjärna och vilka
      vanor som har stöd i forskningen.
    mal:
      - Förstå hur sömnbehov och dygnsrytm samverkar.
      - Upptäcka dina egna sömnmönster och vad som påverkar dem.
      - Pröva vanor som stöder sömnen, till exempel regelbundna tider och dagsljus på morgonen.
    kapitel:
      - id: somnens-arkitektur
        titel: Sömnens arkitektur och sömnstadier
        beskrivning: >-
