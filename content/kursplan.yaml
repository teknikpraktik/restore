        beskrivning: >-
          Stadier i färdighetsinlärning, inlärning genom felkorrigering, betydelsen av
          variation, återkoppling och sömn.
        forkunskaper: [supraspinal-motorisk-kontroll]
        larandemal:
          - Skilja prestation under träning från bestående inlärning.
          - Förklara kontextuell interferens och variabel träning.
          - Redogöra för evidensen om olika former av återkoppling.
        studietid: 75
        innehall: under-produktion
        kontroll: ej-producerad

      - id: muskelspanning-och-belastning
