        innehall: under-produktion
        kontroll: ej-producerad

  - id: kognition-och-emotion
    titel: Kognition, uppmärksamhet och emotioner
    beskrivning: >-
      Exekutiva funktioner, uppmärksamhetens neurala nätverk, emotionernas biologi och
      reglering, och hur belastning påverkar kognitiv kontroll.
    kapitel:
      - id: arbetsminne-och-exekutiva-funktioner
        titel: Arbetsminne och exekutiva funktioner
        beskrivning: >-
          Modeller av arbetsminnet, kapacitetsbegränsningar och de exekutiva funktionerna
          inhibition, uppdatering och flexibilitet.
        forkunskaper: [hjarnans-huvudstrukturer]
        larandemal:
          - Beskriva Baddeleys arbetsminnesmodell.
          - Redogöra för empiriska skattningar av arbetsminnets kapacitet.
          - Skilja de tre huvudsakliga exekutiva funktionerna.
