        larandemal:
          - Beskriva den molekylära återkopplingsslinga som ger cirkadisk rytm.
          - Förklara skillnaden mellan central och perifer klocka.
          - Redogöra för kronotyp och dess mätning.
        studietid: 75
        innehall: under-produktion
        kontroll: ej-producerad

