          Selektiv, delad och uthållig uppmärksamhet. Dorsala och ventrala
          uppmärksamhetsnätverken och kostnaden vid uppgiftsväxling.
        forkunskaper: [arbetsminne-och-exekutiva-funktioner]
        larandemal:
          - Skilja uppmärksamhetens huvudformer.
          - Beskriva de dorsala och ventrala uppmärksamhetsnätverken.
